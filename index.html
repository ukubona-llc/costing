<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eigengap Compute Clutch</title>
    <style>
        :root {
            --bg: #131314;
            --surface: #1e1f22;
            --text-main: #e8eaed;
            --text-muted: #9aa0a6;
            --accent-fast: #81c995; /* Bright Green */
            --accent-slow: #f28b82; /* Bright Pink/Red */
            --wave-1: #8ab4f8; /* Bright Blue */
            --wave-2: #fde293; /* Bright Yellow */
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        h2 {
            font-weight: 400;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 380px;
            background: #131314;
            border-radius: 12px;
            border: 1px solid #28292a;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .legend {
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 0 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            text-align: center;
            border-top: 1px solid #28292a;
            border-bottom: 1px solid #28292a;
            padding: 20px 0;
            margin-top: 10px;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .metric-value {
            font-family: monospace;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 10px 20px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .slider-group {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider-label {
            font-size: 0.9rem;
            width: 100px;
            color: var(--text-main);
        }

        .slider-val {
            font-family: monospace;
            background: #1e1f22;
            padding: 4px 10px;
            border-radius: 6px;
            min-width: 30px;
            text-align: center;
            font-size: 0.9rem;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            background: transparent;
            height: 24px;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: #3c4043;
            border-radius: 1px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            background: #fff;
            border-radius: 50%;
            margin-top: -7px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        input[type="range"]:focus {
            outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Eigengap Compute Clutch</h2>

    <div class="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: var(--accent-fast)"></div> Fast Path (Reflex)</div>
        <div class="legend-item"><div class="dot" style="background: var(--accent-slow)"></div> Slow Path (Inference)</div>
    </div>

    <div class="metrics">
        <div>
            <div class="metric-label">Eigengap (g)</div>
            <div class="metric-value" id="val-g">0.75</div>
        </div>
        <div>
            <div class="metric-label">Status</div>
            <div class="metric-value" id="val-status" style="color: var(--accent-fast)">Reflex</div>
        </div>
    </div>

    <div class="controls">
        <div class="slider-row">
            <div class="slider-group">
                <div class="slider-label">Sigma 1</div>
                <input type="range" id="s1" min="1" max="100" value="80">
                <div class="slider-val" id="val-s1">80</div>
            </div>
            <div class="slider-group">
                <div class="slider-label">Sigma 2</div>
                <input type="range" id="s2" min="1" max="100" value="20">
                <div class="slider-val" id="val-s2">20</div>
            </div>
        </div>
        <div class="slider-row">
            <div class="slider-group">
                <div class="slider-label">Threshold (tau)</div>
                <input type="range" id="tau" min="0.0" max="0.99" step="0.01" value="0.50">
                <div class="slider-val" id="val-tau">0.50</div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const inputs = {
        s1: document.getElementById('s1'),
        s2: document.getElementById('s2'),
        tau: document.getElementById('tau')
    };

    const displays = {
        s1: document.getElementById('val-s1'),
        s2: document.getElementById('val-s2'),
        tau: document.getElementById('val-tau'),
        g: document.getElementById('val-g'),
        status: document.getElementById('val-status')
    };

    let width, height, centerX, centerY;
    let time = 0;
    let particles = [];

    // Colors matching the original screenshot
    const colors = {
        wave1: '#8ab4f8',
        wave2: '#fde293',
        fast: '#81c995',
        slow: '#f28b82',
        inactive: '#3c4043',
        pillBg: '#1e1f22',
        text: '#e8eaed'
    };

    function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        width = rect.width;
        height = rect.height;
        centerX = width / 2;
        centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(isFast) {
            this.progress = 0;
            this.isFast = isFast;
            this.speed = isFast ? 0.015 : 0.012;
            this.offset = (Math.random() - 0.5) * 8; // Slight scatter for the particle stream
        }

        update() {
            this.progress += this.speed;
            return this.progress <= 1;
        }

        draw(ctx) {
            const startX = centerX;
            const startY = centerY;
            const endX = width;
            
            let currentX, currentY;

            if (this.isFast) {
                const endY = centerY - 80;
                currentX = startX + (endX - startX) * this.progress;
                // Bezier curve equivalent math for smooth ease out
                currentY = startY + (endY - startY) * Math.sin(this.progress * Math.PI / 2) + this.offset;
                ctx.fillStyle = colors.fast;
            } else {
                const endY = centerY + 80;
                currentX = startX + (endX - startX) * this.progress;
                currentY = startY + (endY - startY) * (1 - Math.cos(this.progress * Math.PI / 2)) + this.offset;
                ctx.fillStyle = colors.slow;
            }

            ctx.beginPath();
            ctx.arc(currentX, currentY, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawWave(amplitude, frequency, phaseOffset, color, yOffset = 0) {
        ctx.beginPath();
        for (let x = 0; x <= centerX; x += 2) {
            // Fade out the wave as it hits the center clutch
            const fade = Math.max(0, 1 - Math.pow(x / centerX, 4));
            const y = centerY + yOffset + Math.sin(x * frequency + phaseOffset) * amplitude * fade;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.stroke();
    }

    function drawPath(isFast, isActive) {
        const startX = centerX;
        const startY = centerY;
        const endX = width;
        
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        
        const pathEndY = isFast ? centerY - 80 : centerY + 80;

        for(let p = 0; p <= 1; p += 0.02) {
            let px = startX + (endX - startX) * p;
            let py;
            if (isFast) {
                py = startY + (pathEndY - startY) * Math.sin(p * Math.PI / 2);
            } else {
                py = startY + (pathEndY - startY) * (1 - Math.cos(p * Math.PI / 2));
            }
            ctx.lineTo(px, py);
        }

        ctx.strokeStyle = isActive ? (isFast ? colors.fast : colors.slow) : colors.inactive;
        ctx.lineWidth = isActive ? 2.5 : 1.5;
        ctx.stroke();
        
        // Draw the pill label
        if (isActive) {
            const labelX = width - 100;
            const labelY = isFast ? centerY - 100 : centerY + 60;
            
            ctx.fillStyle = colors.pillBg;
            ctx.beginPath();
            ctx.roundRect(labelX, labelY, 90, 26, 13);
            ctx.fill();
            ctx.strokeStyle = '#3c4043';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = colors.text;
            ctx.font = '11px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isFast ? 'Reflex Path' : 'Inference Path', labelX + 45, labelY + 13);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }
    }

    function drawPillLabel(text, x, y) {
        ctx.fillStyle = colors.pillBg;
        ctx.beginPath();
        ctx.roundRect(x, y, 90, 26, 13);
        ctx.fill();
        ctx.strokeStyle = '#3c4043';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = colors.text;
        ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x + 45, y + 13);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    function animate() {
        // Enforce logic: s2 cannot exceed s1
        if (parseInt(inputs.s2.value) > parseInt(inputs.s1.value)) {
            inputs.s2.value = inputs.s1.value;
        }

        const s1 = parseInt(inputs.s1.value);
        const s2 = parseInt(inputs.s2.value);
        const tau = parseFloat(inputs.tau.value);

        const g = s1 === 0 ? 0 : (s1 - s2) / s1;
        const isFast = g > tau;

        // DOM Updates
        displays.s1.innerText = s1;
        displays.s2.innerText = s2;
        displays.tau.innerText = tau.toFixed(2);
        displays.g.innerText = g.toFixed(2);
        
        displays.status.innerText = isFast ? "Reflex" : "Inference";
        displays.status.style.color = isFast ? colors.fast : colors.slow;

        // Clear Canvas
        ctx.clearRect(0, 0, width, height);

        // 1. Draw Output Paths (Right side)
        drawPath(true, isFast);   // Fast Path
        drawPath(false, !isFast); // Slow Path

        // 2. Draw Input Waves (Left side)
        const amp1 = (s1 / 100) * 45;
        const amp2 = (s2 / 100) * 45;
        
        drawWave(amp1, 0.04, time * 0.06, colors.wave1);
        drawWave(amp2, 0.06, time * 0.09, colors.wave2, 10); // slight offset for visual separation

        // Label Input on Canvas
        drawPillLabel('Input (Signal)', 20, centerY - 60);

        // 3. Center Node (The Clutch Wheel)
        ctx.beginPath();
        ctx.arc(centerX, centerY, 32, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; // slight transparent fill
        ctx.fill();
        
        // Dashed border
        ctx.strokeStyle = '#9aa0a6';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.setLineDash([]); // reset

        // Draw 'g' value directly inside the wheel
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`g=${g.toFixed(2)}`, centerX, centerY);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic'; // reset

        // 4. Update and Draw Particles
        // Spawn particles steadily based on the active path
        if (Math.random() < 0.35) {
            particles.push(new Particle(isFast));
        }

        particles = particles.filter(p => {
            const alive = p.update();
            if (alive) p.draw(ctx);
            return alive;
        });

        time++;
        requestAnimationFrame(animate);
    }

    // Start rendering loop
    animate();
</script>
</body>
</html>
